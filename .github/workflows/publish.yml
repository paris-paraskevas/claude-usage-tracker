name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token needed.
# Triggers when you publish a GitHub Release, or run it manually.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the wheel ships the UI and runs
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for need in ("claude_usage_tracker.py", "ctu/engine.py", "ctu/ui/dashboard.html",
                       "ctu/ui/overlay.html", "ctu/ui/flyout.html"):
              assert need in names, f"{need} missing from the wheel"
          PY
          python -m pip install dist/*.whl
          claude-usage-tracker --version
          claude-usage-tracker --selftest
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
