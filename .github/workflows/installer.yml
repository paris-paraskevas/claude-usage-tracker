name: Build Windows installer

# On each published release: bundle the app with PyInstaller, build a Windows
# installer with Inno Setup, and attach ClaudeUsageTracker-Setup.exe to the release.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write          # upload the release asset
      actions: read            # SignPath reads the unsigned build artifact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Generate icon
        run: python -c "from ctu.tray import make_app_icon; make_app_icon(256).save('app.ico', sizes=[(16,16),(20,20),(24,24),(32,32),(40,40),(48,48),(64,64),(128,128),(256,256)])"

      # --onedir + --noupx: UPX-packed and onefile binaries are the two biggest
      # antivirus / SmartScreen false-positive triggers for PyInstaller apps.
      # We're already onedir; --noupx makes "no UPX" deterministic regardless of
      # whether the runner image happens to have upx on PATH. Do NOT re-enable UPX.
      - name: Build standalone app (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onedir --noupx --noconsole
          --name ClaudeUsageTracker --icon app.ico
          --collect-all webview --collect-all clr_loader --collect-all pythonnet
          --collect-all nacl --collect-all qrcode
          --hidden-import _cffi_backend
          --hidden-import pystray._win32
          --collect-submodules ctu
          --add-data "ctu/ui;ctu/ui"
          claude_usage_tracker.py

      # The windowed exe still sets its exit code: build state from fixtures, serve the API,
      # SSE and the bundled UI files, render the tray icons — no network, no user data.
      - name: Smoke test the bundle (--version, --selftest)
        shell: pwsh
        run: |
          $exe = "dist\ClaudeUsageTracker\ClaudeUsageTracker.exe"
          foreach ($a in @("--version", "--selftest")) {
            $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "$a exited with $($p.ExitCode)" }
          }
          if (-not (Test-Path "dist\ClaudeUsageTracker\_internal\ctu\ui\dashboard.html")) { throw "ctu/ui missing from the bundle" }

      # A release (or a run started on a release tag by release.yml) uses the tag (v0.4.0 -> 0.4.0);
      # a manual run on a branch (test build) uses the package version.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=$(python -c 'import ctu; print(ctu.__version__)')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.v }} installer.iss

      # --- Code signing via SignPath (free for open source). ---
      # Inert until you set the repo variable SIGNPATH_ORGANIZATION_ID + secret
      # SIGNPATH_API_TOKEN (and install the SignPath GitHub App). Docs:
      # https://about.signpath.io/product/open-source
      - name: Upload unsigned installer (for SignPath)
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/ClaudeUsageTracker-Setup.exe

      - name: Sign installer (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: claude-usage-tracker
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed

      # Always keep the installer as a downloadable run artifact, so a manual run gives a test
      # installer without publishing anything.
      - name: Pick the installer (signed if available)
        id: setup
        shell: bash
        run: |
          SETUP=dist/ClaudeUsageTracker-Setup.exe
          [ -f dist-signed/ClaudeUsageTracker-Setup.exe ] && SETUP=dist-signed/ClaudeUsageTracker-Setup.exe
          echo "path=$SETUP" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageTracker-Setup-${{ steps.ver.outputs.v }}
          path: ${{ steps.setup.outputs.path }}
          retention-days: 14

      - name: Attach installer to the release (signed if available)
        if: ${{ github.event_name == 'release' || github.ref_type == 'tag' }}
        shell: bash
        run: |
          SETUP=dist/ClaudeUsageTracker-Setup.exe
          [ -f dist-signed/ClaudeUsageTracker-Setup.exe ] && SETUP=dist-signed/ClaudeUsageTracker-Setup.exe
          echo "uploading: $SETUP"
          gh release upload "${GITHUB_REF_NAME}" "$SETUP" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
