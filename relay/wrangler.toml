# Claude Usage Tracker — remote relay (Cloudflare Worker)
# Phone sync contract: docs/REMOTE.md · claude.ai connector: docs/MCP-REMOTE.md
name = "claude-usage-relay"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# KV holds the small, rarely-written phone-sync keys: each account's auth-token hash and its
# FCM push-token set (plus the cached Google access token). Create with:
#   npx wrangler kv namespace create KV            # paste the id below
#   npx wrangler kv namespace create KV --preview  # paste the preview_id below
[[kv_namespaces]]
binding = "KV"
id = "91af90ba92614681a59dcb51fccfe11f"
preview_id = "c459a83c77494a6eb01c50d6f69f3a10"

# D1 holds phone-sync snapshot ciphertext (written every ~10s, so not KV) and the claude.ai
# connector's OAuth state. Free tier: 100k writes/day, 5M reads/day. Set up a fresh database:
#   npx wrangler d1 create claude-usage-team                                  # paste database_id below
#   npx wrangler d1 execute claude-usage-team --remote --file=schema.sql      # apply schema (remote)
#   npx wrangler d1 execute claude-usage-team --local  --file=schema.sql      # ...and for `wrangler dev`
# Upgrading an existing database: apply migrations/0002_drop_team_stack.sql once (see README).
[[d1_databases]]
binding = "DB"
database_name = "claude-usage-team"
database_id = "ee600614-6646-4b2d-8637-9ecad2c087e3"

# Supabase account-pool connector (docs/RELEASE-0.3.md): the claude.ai connector reads the pool
# from Supabase. SUPABASE_URL is public; SUPABASE_SECRET is the sb_secret_ key, set out of band:
#   npx wrangler secret put SUPABASE_SECRET
[vars]
SUPABASE_URL = "https://sxciunvkygtehhztfjjo.supabase.co"

# Push secrets (do NOT put these here — set them out of band):
#   npx wrangler secret put FCM_PROJECT_ID
#   npx wrangler secret put FCM_CLIENT_EMAIL
#   npx wrangler secret put FCM_PRIVATE_KEY     # paste the service-account private_key (PEM)

# Daily housekeeping at 03:17 UTC: prunes expired snapshots, OAuth codes/tokens/refresh
# tokens, never-used OAuth clients and old registration rate-limit rows.
[triggers]
crons = ["17 3 * * *"]
